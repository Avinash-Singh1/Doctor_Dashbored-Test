name: Deploy Angular App to Hostinger VPS

on:
  push:
    branches:
      - production  # triggers deployment when you push to the production branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build:prod

      - name: Archive production build
        run: tar -czf dist.tar.gz dist/

      - name: Copy build files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dist.tar.gz"
          target: "/var/www/doctor-dashboard"

      - name: Deploy and start PM2 on VPS
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/doctor-dashboard

            echo "🔧 Cleaning up old deployment..."
            rm -rf dist.old
            if [ -d "dist" ]; then
              mv dist dist.old
            fi

            echo "📦 Extracting new build..."
            tar -xzf dist.tar.gz
            rm dist.tar.gz

            echo "📁 Adjusting Angular dist folder..."
            # Handle nested Angular output (dist/browser or dist/doctor-dashboard/browser)
            if [ -d "dist/doctor-dashboard/browser" ]; then
              mv dist/doctor-dashboard/browser dist
            elif [ -d "dist/browser" ]; then
              mv dist/browser dist
            fi

            echo "🚀 Starting app with PM2 on port 9000..."
            # Install PM2 and http-server if missing
            if ! command -v pm2 &> /dev/null; then
              npm install -g pm2
            fi
            if ! command -v http-server &> /dev/null; then
              npm install -g http-server
            fi

            # Start or restart the Angular app
            if pm2 list | grep -q "doctor-dashboard"; then
              pm2 restart doctor-dashboard
            else
              pm2 start "http-server dist -p 9000" --name "doctor-dashboard"
              pm2 save
            fi

            echo "✅ Deployment complete!"
            echo "🌐 Your app should be live at: http://${{ secrets.VPS_HOST }}:9000/"
