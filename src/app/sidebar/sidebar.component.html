<nav class="sidebar-content">
  <div class="sidebar-header">
    <h2>NectarPlus</h2>
  </div>

  <ul class="sidebar-menu">
    <li *ngFor="let item of menuItems">
      <!-- If item has children (dropdown) -->
      <ng-container *ngIf="item.children; else normalItem">
        <a href="javascript:void(0)" (click)="toggleDropdown(item)">
          <span class="material-icons">{{ item.icon }}</span>
          <span class="label">{{ item.label }}</span>
          <span class="arrow" [class.open]="item.expanded">▸</span>
        </a>

        <!-- Submenu -->
        <div class="submenu" *ngIf="item.expanded">
          <a *ngFor="let child of item.children"
             [routerLink]="child.path"
             routerLinkActive="active">
            <span class="material-icons">{{ child.icon }}</span>
            <span>{{ child.label }}</span>
          </a>
        </div>
      </ng-container>

      <!-- Normal items -->
      <ng-template #normalItem>
        <a [routerLink]="item.path" routerLinkActive="active">
          <span class="material-icons">{{ item.icon }}</span>
          <span class="label">{{ item.label }}</span>
        </a>
      </ng-template>
    </li>
  </ul>
</nav>
