<div class="signup-container">
  <h2>Create Doctor Account</h2>
  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>Name</label>
      <input type="text" [(ngModel)]="doctor.name" name="name" required />
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="doctor.email" name="email" required />
    </div>

    <div class="form-group">
      <label>Phone</label>
      <input type="text" [(ngModel)]="doctor.phone" name="phone" required />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" [(ngModel)]="doctor.password" name="password" required />
    </div>

    <button type="submit">Sign Up</button>
  </form>

  <div class="links">
    <a routerLink="/auth/login">Already have an account? Login</a>
  </div>
</div>
