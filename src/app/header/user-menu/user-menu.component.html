<div class="user-menu">
  <!-- User info section -->
  <div class="user-info">
    <div class="avatar">{{ doctorName.charAt(0) }}</div>
    <div class="details">
      <span class="name">{{ doctorName }}</span>
      <span class="phone">{{ phone }}</span>
    </div>
  </div>

  <!-- Action buttons -->
  <div class="menu-actions">
    <button class="btn-secondary" routerLink="/settings">Account Settings</button>
    <button class="btn-secondary" routerLink="/profile">View My Profile</button>
    <button class="btn-danger" (click)="logout()">Log out</button>
  </div>
</div>
